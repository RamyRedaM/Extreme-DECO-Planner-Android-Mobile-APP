name: Build APK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the APK on the Releases page"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create debug signing key
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --continue

      - name: Report test results
        if: always()
        run: |
          python3 - << 'PY'
          import glob, xml.etree.ElementTree as ET
          total = failed = 0
          for f in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              root = ET.parse(f).getroot()
              for tc in root.iter("testcase"):
                  total += 1
                  for fail in list(tc.findall("failure")) + list(tc.findall("error")):
                      failed += 1
                      msg = (fail.get("message") or "").replace("\n", " ")[:900]
                      print(f"::error title={tc.get('classname').split('.')[-1]}.{tc.get('name')}::{msg}")
              out = root.findtext("system-out") or ""
              for line in out.splitlines():
                  if line.startswith("DIAG"):
                      print(f"::notice title=diag::{line[:900]}")
          print(f"::notice title=tests::{total} tests, {failed} failed")
          PY

      - name: Stop if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "Extreme-DECO-Planner-v$VERSION.apk"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Extreme-DECO-Planner-v${{ env.VERSION }}
          path: Extreme-DECO-Planner-v${{ env.VERSION }}.apk

      - name: Publish APK on the Releases page
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Extreme DECO Planner v${{ env.VERSION }}
          prerelease: true
          files: Extreme-DECO-Planner-v${{ env.VERSION }}.apk
          body: |
            Test build of Extreme DECO Planner for Android (7.0 or later).

            **Install:** download the APK on your phone, open it, and allow "Install unknown apps" for your browser or file manager when Android asks.

            This is a test build signed with a debug key. It is for training and planning only and does not replace training, a dive computer or your own judgement. Always cross-check plans with a second planner.
